<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
body { background: #06261a; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
svg { width: 300px; height: 190px; }
</style>
</head>
<body>
<svg viewBox="0 0 300 190" class="gauge-svg" xmlns="http://www.w3.org/2000/svg">
  <!-- 3 Gauge Arc Segments: Green, Amber, Red with flat ends -->
  <path d="M 45.00 140.00 A 105 105 0 0 1 88.28 55.05" fill="none" stroke="#16c479" stroke-width="16" stroke-linecap="butt" />
  <path d="M 88.28 55.05 A 105 105 0 0 1 182.45 40.14" fill="none" stroke="#da9c1f" stroke-width="16" stroke-linecap="butt" />
  <path d="M 182.45 40.14 A 105 105 0 0 1 255.00 140.00" fill="none" stroke="#da4754" stroke-width="16" stroke-linecap="butt" />

  <!-- Needle -->
  <line x1="150" y1="140" x2="73.37" y2="117.74" stroke="#d5e6f5" stroke-width="3.5" stroke-linecap="round" />

  <!-- Center Solid Pivot -->
  <circle cx="150" cy="140" r="8.5" fill="#d5e6f5" />

  <!-- Score Value under needle -->
  <text x="150" y="172" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="26" font-weight="700" fill="#d5e6f5">9.0</text>
</svg>
</body>
</html>
