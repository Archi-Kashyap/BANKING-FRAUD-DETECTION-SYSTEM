<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<style>
  :root {
    --bg-panel:  #0F1B2A;
    --bg-node:   #162236;
    --fg-safe:   #22c55e;
    --fg-warn:   #f59e0b;
    --fg-danger: #ef4444;
    --fg-muted:  #6b8299;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg-panel);
    overflow-x: auto;
  }
  .wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding: 8px 0;
  }
  .wrap svg {
    display: block;
    min-width: 560px;
    max-width: 700px;
    width: 100%;
    margin: 0 auto;
  }
  /* ── Dash-flow animation ────────────────────────────── */
  @keyframes dash-flow {
    from { stroke-dashoffset: 0; }
    to   { stroke-dashoffset: -18; }
  }
  @media (prefers-reduced-motion: reduce) {
    path { animation: none !important; }
  }
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<script>

(function () {
  /* ── helpers ─────────────────────────────────────────────── */
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function riskColor(score) {
    if (score < 30)  return 'var(--fg-safe,   #22c55e)';
    if (score < 60)  return 'var(--fg-warn,   #f59e0b)';
    return                   'var(--fg-danger, #ef4444)';
  }

  function verdictColor(label) {
    var m = { SAFE: 'var(--fg-safe, #22c55e)',
              SUSPICIOUS: 'var(--fg-warn, #f59e0b)',
              FRAUD: 'var(--fg-danger, #ef4444)' };
    return m[label] || 'var(--fg-safe, #22c55e)';
  }

  /* ── SVG primitive helpers ───────────────────────────────── */
  function svgEl(tag, attrs, children) {
    var NS = 'http://www.w3.org/2000/svg';
    var el = document.createElementNS(NS, tag);
    for (var k in attrs) el.setAttribute(k, attrs[k]);
    if (Array.isArray(children)) children.forEach(function(c){ if(c) el.appendChild(c); });
    else if (children) el.appendChild(children);
    return el;
  }

  function svgText(x, y, txt, attrs) {
    var el = svgEl('text', Object.assign({ x: x, y: y }, attrs));
    el.textContent = txt;
    return el;
  }

  function curvePath(x1, y1, x2, y2) {
    var mx = (x1 + x2) / 2;
    return 'M ' + x1 + ' ' + y1 + ' C ' + mx + ' ' + y1 + ', ' + mx + ' ' + y2 + ', ' + x2 + ' ' + y2;
  }

  /* ── node box builder ────────────────────────────────────── */
  function makeNode(cx, cy, w, h, label, sublabel, borderColor, scoreOrNull) {
    var x = cx - w / 2, y = cy - h / 2;
    var g = svgEl('g', {});

    /* background */
    g.appendChild(svgEl('rect', {
      x: x, y: y, width: w, height: h, rx: 3,
      fill: 'var(--bg-node, #162236)',
      stroke: borderColor,
      'stroke-width': scoreOrNull !== null ? '1' : '2'
    }));

    if (scoreOrNull !== null) {
      /* agent node: label top, score bottom */
      g.appendChild(svgText(cx, cy - 7, label, {
        'text-anchor': 'middle',
        fill: 'var(--fg-muted, #6b8299)',
        'font-size': '7',
        'font-family': '"JetBrains Mono", "Fira Code", monospace'
      }));
      g.appendChild(svgText(cx, cy + 9, scoreOrNull.toFixed(0), {
        'text-anchor': 'middle',
        fill: borderColor,
        'font-size': '13',
        'font-weight': 'bold',
        'font-family': '"JetBrains Mono", "Fira Code", monospace'
      }));
    } else {
      /* input / consensus node: two lines */
      g.appendChild(svgText(cx, cy - 4, label, {
        'text-anchor': 'middle',
        fill: 'var(--fg-muted, #6b8299)',
        'font-size': '7',
        'font-family': '"JetBrains Mono", "Fira Code", monospace'
      }));
      g.appendChild(svgText(cx, cy + 7, sublabel, {
        'text-anchor': 'middle',
        fill: borderColor,
        'font-size': '8',
        'font-weight': 'bold',
        'font-family': '"JetBrains Mono", "Fira Code", monospace'
      }));
    }

    return g;
  }

  /* ── animated path builder ───────────────────────────────── */
  function makeAnimatedPath(d, color, strokeW, animId, reducedMotion) {
    var dashLen = 10, gapLen = 8, totalDash = dashLen + gapLen;
    var path = svgEl('path', {
      d: d,
      fill: 'none',
      stroke: color,
      'stroke-width': strokeW,
      'stroke-dasharray': dashLen + ' ' + gapLen,
      'stroke-linecap': 'round'
    });

    if (!reducedMotion) {
      /* CSS animation injected via <style> inside SVG */
      path.setAttribute('style',
        'animation: dash-flow-' + animId + ' 1.6s linear infinite;');
    }

    return path;
  }

  /* ── main render function ────────────────────────────────── */
  window.renderAgentNetwork = function(result) {
    var behavior  = clamp(+result.behavior  || 0, 0, 100);
    var velocity  = clamp(+result.velocity  || 0, 0, 100);
    var risk      = clamp(+result.risk      || 0, 0, 100);
    var anomaly   = clamp(+result.anomaly   || 0, 0, 100);
    var consensus = result.consensus || 0;
    var label     = (result.label  || 'SAFE').toUpperCase();
    var txId      = (result.t && result.t.id) ? String(result.t.id) : 'TXN';

    /* Agent 1 uses max(behavior, velocity) */
    var agent1Score = Math.max(behavior, velocity);
    var agent2Score = risk;
    var agent3Score = anomaly;

    var vColor     = verdictColor(label);
    var c1         = riskColor(agent1Score);
    var c2         = riskColor(agent2Score);
    var c3         = riskColor(agent3Score);

    var reducedMotion = window.matchMedia &&
                        window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* Layout constants (viewBox 700 × 200) */
    var VW = 700, VH = 200;
    var NW = 110, NH = 44;   /* node width / height */

    /* X centres */
    var xIn  = 90;
    var xMid = 360;
    var xOut = 620;

    /* Y centres for the three agents */
    var yTop = 55, yMid = 100, yBot = 145;

    /* Y centre for input / consensus nodes */
    var yCtr = 100;

    /* ── build keyframes string ─────────────────────────── */
    var agents = [
      { score: agent1Score, color: c1, id: 1, yAgent: yTop },
      { score: agent2Score, color: c2, id: 2, yAgent: yMid },
      { score: agent3Score, color: c3, id: 3, yAgent: yBot }
    ];

    var keyframes = '';
    agents.forEach(function(a) {
      var totalDash = 18; /* dashLen + gapLen */
      /* left path */
      keyframes += '@keyframes dash-flow-L' + a.id + ' {' +
        'from { stroke-dashoffset: 0; } to { stroke-dashoffset: -' + totalDash + '; } }';
      /* right path */
      keyframes += '@keyframes dash-flow-R' + a.id + ' {' +
        'from { stroke-dashoffset: 0; } to { stroke-dashoffset: -' + totalDash + '; } }';
    });

    /* ── SVG root ───────────────────────────────────────── */
    var svg = svgEl('svg', {
      viewBox: '0 0 ' + VW + ' ' + VH,
      xmlns: 'http://www.w3.org/2000/svg',
      role: 'img',
      'aria-label': 'Agent network diagram: verdict ' + label + ', consensus ' + consensus + ' of 3 agents flagged high risk.',
      style: [
        'width:100%',
        'min-width:560px',
        'max-width:' + VW + 'px',
        'display:block',
        '--bg-panel:#0F1B2A',
        '--bg-node:#162236',
        '--fg-safe:#22c55e',
        '--fg-warn:#f59e0b',
        '--fg-danger:#ef4444',
        '--fg-muted:#6b8299'
      ].join(';')
    });

    /* panel background */
    svg.appendChild(svgEl('rect', {
      x: 0, y: 0, width: VW, height: VH,
      fill: 'var(--bg-panel, #0F1B2A)'
    }));

    /* ── <defs> for clip (optional) ─────────────────────── */
    /* ── <style> for animations ─────────────────────────── */
    var styleEl = svgEl('style', {});
    var cssText = reducedMotion ? '' : keyframes;
    agents.forEach(function(a) {
      var sw = (1 + a.score / 35).toFixed(2);
      var dur = (2.4 - a.score / 80).toFixed(2); /* faster when riskier */
      cssText += [
        '.path-L' + a.id + '{',
          'animation: dash-flow-L' + a.id + ' ' + dur + 's linear infinite;',
          'stroke-width:' + sw + ';',
        '}',
        '.path-R' + a.id + '{',
          'animation: dash-flow-R' + a.id + ' ' + dur + 's linear infinite;',
          'stroke-width:' + sw + ';',
        '}'
      ].join('');
    });
    styleEl.textContent = cssText;
    svg.appendChild(styleEl);

    /* ── connection paths ───────────────────────────────── */
    agents.forEach(function(a) {
      var sw = (1 + a.score / 35).toFixed(2);
      var dashArr = '10 8';

      /* left: Transaction → Agent  (right edge of input node → left edge of agent node) */
      var lx1 = xIn  + NW / 2;
      var lx2 = xMid - NW / 2;
      var dL = curvePath(lx1, yCtr, lx2, a.yAgent);

      var pL = svgEl('path', {
        d: dL, fill: 'none', stroke: a.color,
        'stroke-width': sw, 'stroke-dasharray': dashArr, 'stroke-linecap': 'round',
        'class': reducedMotion ? '' : 'path-L' + a.id
      });
      svg.appendChild(pL);

      /* right: Agent → Consensus  (right edge of agent node → left edge of consensus node) */
      var rx1 = xMid + NW / 2;
      var rx2 = xOut - NW / 2;
      var dR = curvePath(rx1, a.yAgent, rx2, yCtr);

      var pR = svgEl('path', {
        d: dR, fill: 'none', stroke: a.color,
        'stroke-width': sw, 'stroke-dasharray': dashArr, 'stroke-linecap': 'round',
        'class': reducedMotion ? '' : 'path-R' + a.id
      });
      svg.appendChild(pR);
    });

    /* ── nodes ──────────────────────────────────────────── */
    /* Transaction input node */
    var txLabel = txId.length > 12 ? txId.slice(0, 11) + '\u2026' : txId;
    svg.appendChild(makeNode(xIn, yCtr, NW, NH, 'Transaction', txLabel, '#3a5068', null));

    /* Agent nodes */
    var agentDefs = [
      { label: 'Behavior Analyzer', score: agent1Score, color: c1, y: yTop },
      { label: 'Risk Assessor',     score: agent2Score, color: c2, y: yMid },
      { label: 'Tx Validator',      score: agent3Score, color: c3, y: yBot }
    ];
    agentDefs.forEach(function(a) {
      svg.appendChild(makeNode(xMid, a.y, NW, NH, a.label, null, a.color, a.score));
    });

    /* Consensus node */
    var consensusLine1 = 'Consensus ' + consensus + '/3';
    svg.appendChild(makeNode(xOut, yCtr, NW, NH, consensusLine1, label, vColor, null));

    /* ── override consensus border to 2px ───────────────── */
    var cRect = svg.querySelector('rect:last-of-type');
    /* The last rect before text nodes is the consensus bg — approach via group order */
    /* We'll patch the last makeNode rect directly by using a wrapper group and re-styling */

    return svg;
  };
})();

document.addEventListener('DOMContentLoaded', function() {
  var result = {"behavior": 72.0, "velocity": 55.0, "risk": 38.0, "anomaly": 18.0, "consensus": 2, "label": "SUSPICIOUS", "t": {"id": "TXN-00042"}};
  var svg = window.renderAgentNetwork(result);
  document.getElementById('wrap').appendChild(svg);
});
</script>
</body>
</html>
