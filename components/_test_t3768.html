<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<style>
:root {
  --color-safe: #19E08A;
  --color-elevated: #FFB020;
  --color-danger: #FF4D5E;
  --color-muted: #4A6A80;
  --color-cyan: #00D1FF;
  --color-text: #E0F4FF;
  --bg-node: #0F1B2A;
  --bg-canvas: #091525;
  --glow-safe: rgba(25, 224, 138, 0.35);
  --glow-elevated: rgba(255, 176, 32, 0.35);
  --glow-danger: rgba(255, 77, 94, 0.35);
  --glow-safe-consensus: rgba(25, 224, 138, 0.40);
  --glow-elevated-consensus: rgba(255, 176, 32, 0.40);
  --glow-danger-consensus: rgba(255, 77, 94, 0.40);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg-canvas, #091525); overflow-x: auto; width: 100%; }
body { padding: 0; }
</style>
</head>
<body>
<script>

function network(r) {
  /* ── 1. Data extraction & validation ────────────────────────── */
  const behavior  = Math.max(0, Math.min(100, +(r && r.behavior)  || 0));
  const velocity  = Math.max(0, Math.min(100, +(r && r.velocity)  || 0));
  const risk      = Math.max(0, Math.min(100, +(r && r.risk)      || 0));
  const anomaly   = Math.max(0, Math.min(100, +(r && r.anomaly)   || 0));
  const combined  = Math.max(0, Math.min(100, +(r && r.combined)  || 0));
  const consensus = Math.max(0, Math.min(3,   +(r && r.consensus) || 0));
  const label     = (r && r.label ? String(r.label) : 'SAFE').toUpperCase();
  const txId      = (r && r.t && r.t.id) ? String(r.t.id) : 'TXN';

  // Agent scores
  const a1Score = Math.max(behavior, velocity);  // Agent 1: Behavior Analyzer
  const a2Score = risk;                           // Agent 2: Risk Assessor
  const a3Score = anomaly;                        // Agent 3: Transaction Validator

  /* ── 2. Color helpers with CSS variables and exact fallbacks ── */
  function getRiskColor(s) {
    if (s < 30) return 'var(--color-safe, #19E08A)';
    if (s < 60) return 'var(--color-elevated, #FFB020)';
    return 'var(--color-danger, #FF4D5E)';
  }

  function getVerdictColor(v) {
    if (v === 'SAFE')       return 'var(--color-safe, #19E08A)';
    if (v === 'SUSPICIOUS') return 'var(--color-elevated, #FFB020)';
    return 'var(--color-danger, #FF4D5E)';
  }

  function getRiskGlow(s) {
    if (s < 30) return 'var(--glow-safe, rgba(25, 224, 138, 0.35))';
    if (s < 60) return 'var(--glow-elevated, rgba(255, 176, 32, 0.35))';
    return 'var(--glow-danger, rgba(255, 77, 94, 0.35))';
  }

  function getVerdictGlow(v) {
    if (v === 'SAFE')       return 'var(--glow-safe-consensus, rgba(25, 224, 138, 0.40))';
    if (v === 'SUSPICIOUS') return 'var(--glow-elevated-consensus, rgba(255, 176, 32, 0.40))';
    return 'var(--glow-danger-consensus, rgba(255, 77, 94, 0.40))';
  }

  function getRawColor(s) {
    if (s < 30) return '#19E08A';
    if (s < 60) return '#FFB020';
    return '#FF4D5E';
  }

  function getLevelTag(s) {
    if (s < 30) return 'LOW';
    if (s < 60) return 'ELEVATED';
    return 'HIGH';
  }

  const c1 = getRiskColor(a1Score);
  const c2 = getRiskColor(a2Score);
  const c3 = getRiskColor(a3Score);
  const vc = getVerdictColor(label);

  const raw1 = getRawColor(a1Score);
  const raw2 = getRawColor(a2Score);
  const raw3 = getRawColor(a3Score);

  /* ── 3. Exact spec measurements ──────────────────────────────── */
  const VW = 960, VH = 420;

  // Node 1: Input (x=40, y=168, w=180, h=84, rx=8)
  const IN_X = 40, IN_Y = 168, IN_W = 180, IN_H = 84;
  const IN_CX = 130;

  // Nodes 2-4: Agents (x=340, w=260, h=80, rx=8)
  const AG_X = 340, AG_W = 260, AG_H = 80;
  const AG_Y  = [50, 170, 290];
  const AG_CY = [90, 210, 330];

  // Node 5: Consensus (x=720, y=150, w=200, h=120, rx=8)
  const CN_X = 720, CN_Y = 150, CN_W = 200, CN_H = 120;
  const CN_CX = 820;

  // Ports
  const portIN_X = 220;
  const portPY = [192, 210, 228];
  const portCN_X = 720;
  const portCN_XA = 716;

  /* ── 4. Unique ID for keyframes & markers ─────────────────────── */
  const uid = 'an_' + Math.random().toString(36).slice(2, 8);

  const lines = [];
  const p = s => lines.push(s);

  /* ── 5. Build SVG string ─────────────────────────────────────── */
  p(`<div style="overflow-x:auto;-webkit-overflow-scrolling:touch;background:#091525;padding:0;margin:0;">`);
  p(`<svg viewBox="0 0 ${VW} ${VH}" width="100%" height="auto"`);
  p(` xmlns="http://www.w3.org/2000/svg"`);
  p(` role="img"`);
  p(` aria-label="Agent network: consensus ${consensus} of 3, verdict ${label}"`);
  p(` style="display:block;min-width:720px;font-family:'JetBrains Mono',monospace;">`);

  // Defs: styles, markers, clipPaths
  p(`<defs>`);
  p(`<style>
    @keyframes flow_${uid} {
      from { stroke-dashoffset: 0; }
      to   { stroke-dashoffset: -28; }
    }
    @media (prefers-reduced-motion: reduce) {
      .flow-dash_${uid} { animation: none !important; }
    }
  </style>`);

  // Markers for arrowheads (8x8 triangle, orient="auto")
  const markerColors = [
    { id: 'safe', raw: '#19E08A' },
    { id: 'elevated', raw: '#FFB020' },
    { id: 'danger', raw: '#FF4D5E' }
  ];
  markerColors.forEach(m => {
    p(`<marker id="arr_${m.id}_${uid}" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto" markerUnits="userSpaceOnUse">`);
    p(`  <path d="M 0 0 L 8 4 L 0 8 z" fill="${m.raw}"/>`);
    p(`</marker>`);
  });

  // Clip paths for agent nodes to keep 4px accent bar rounded cleanly
  for (let i = 0; i < 3; i++) {
    p(`<clipPath id="clip_ag_${i}_${uid}">`);
    p(`  <rect x="${AG_X}" y="${AG_Y[i]}" width="${AG_W}" height="${AG_H}" rx="8"/>`);
    p(`</clipPath>`);
  }
  p(`</defs>`);

  // Canvas background
  p(`<rect width="${VW}" height="${VH}" fill="#091525"/>`);

  // Column Headers (y=28, font 11px mono, letter-spacing 1.5px, muted)
  const headerStyle = `font-size:11px;fill:var(--color-muted, #4A6A80);letter-spacing:1.5px;font-family:'JetBrains Mono',monospace;`;
  p(`<text x="130" y="28" text-anchor="middle" style="${headerStyle}">INPUT</text>`);
  p(`<text x="470" y="28" text-anchor="middle" style="${headerStyle}">AGENTS</text>`);
  p(`<text x="820" y="28" text-anchor="middle" style="${headerStyle}">VERDICT</text>`);

  /* ── 6. Connectors (drawn behind nodes) ──────────────────────── */
  function drawConnector(score, color, rawColor, py, cy) {
    const sw = (1.5 + (score / 100) * 2.5).toFixed(2);
    const mId = rawColor === '#19E08A' ? 'safe' : (rawColor === '#FFB020' ? 'elevated' : 'danger');

    // Bezier formulas:
    // Input to agent i: M 220 py  C 280 py, 280 cy, 340 cy
    const dLeft = `M ${portIN_X} ${py} C 280 ${py}, 280 ${cy}, ${AG_X} ${cy}`;
    // Agent i to consensus: M 600 cy  C 660 cy, 660 py, 716 py
    const dRight = `M ${AG_X + AG_W} ${cy} C 660 ${cy}, 660 ${py}, ${portCN_XA} ${py}`;

    // Port dots: circle r=4 at each port, fill = line color
    p(`<circle cx="${portIN_X}" cy="${py}" r="4" fill="${color}"/>`);
    p(`<circle cx="${portCN_X}" cy="${py}" r="4" fill="${color}"/>`);

    // LEFT: Base line (solid, stroke-width = 1.5 + score/100*2.5, opacity 0.3, stroke-linecap round)
    p(`<path d="${dLeft}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" opacity="0.3"/>`);
    // LEFT: Flow overlay (stroke-width 2, stroke-dasharray "2 12", stroke-linecap round, opacity 1, 1.4s)
    p(`<path d="${dLeft}" fill="none" stroke="${color}" stroke-width="2" stroke-dasharray="2 12" stroke-linecap="round" opacity="1" class="flow-dash_${uid}" style="animation: flow_${uid} 1.4s linear infinite;"/>`);

    // RIGHT: Base line
    p(`<path d="${dRight}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" opacity="0.3"/>`);
    // RIGHT: Flow overlay + arrowhead marker
    p(`<path d="${dRight}" fill="none" stroke="${color}" stroke-width="2" stroke-dasharray="2 12" stroke-linecap="round" opacity="1" class="flow-dash_${uid}" marker-end="url(#arr_${mId}_${uid})" style="animation: flow_${uid} 1.4s linear infinite;"/>`);
  }

  drawConnector(a1Score, c1, raw1, portPY[0], AG_CY[0]);
  drawConnector(a2Score, c2, raw2, portPY[1], AG_CY[1]);
  drawConnector(a3Score, c3, raw3, portPY[2], AG_CY[2]);

  /* ── 7. Node 1: Input (left column) ─────────────────────────── */
  p(`<rect x="${IN_X}" y="${IN_Y}" width="${IN_W}" height="${IN_H}" rx="8" fill="#0F1B2A" stroke="#00D1FF" stroke-width="1.5"/>`);
  p(`<text x="${IN_CX}" y="200" text-anchor="middle" style="font-size:12px;fill:var(--color-muted, #4A6A80);font-family:'JetBrains Mono',monospace;">Transaction</text>`);
  const txDisplay = txId.length > 10 ? txId.slice(0, 9) + '…' : txId;
  p(`<text x="${IN_CX}" y="230" text-anchor="middle" style="font-size:22px;font-weight:bold;fill:var(--color-text, #E0F4FF);font-family:'JetBrains Mono',monospace;">${txDisplay}</text>`);

  /* ── 8. Nodes 2-4: Agents (middle column) ────────────────────── */
  const agents = [
    { name: 'Behavior Analyzer',     score: a1Score, color: c1, glow: getRiskGlow(a1Score), y: AG_Y[0] },
    { name: 'Risk Assessor',         score: a2Score, color: c2, glow: getRiskGlow(a2Score), y: AG_Y[1] },
    { name: 'Transaction Validator', score: a3Score, color: c3, glow: getRiskGlow(a3Score), y: AG_Y[2] }
  ];

  agents.forEach((a, i) => {
    // Rect width=260, height=80, rx=8, x=340
    p(`<rect x="${AG_X}" y="${a.y}" width="${AG_W}" height="${AG_H}" rx="8" fill="#0F1B2A" stroke="${a.color}" stroke-width="1.5" style="filter:drop-shadow(0 0 12px ${a.glow});"/>`);
    // Left accent bar: rect 4px wide x 80px tall, clipped to rx=8
    p(`<rect x="${AG_X}" y="${a.y}" width="4" height="${AG_H}" fill="${a.color}" clip-path="url(#clip_ag_${i}_${uid})"/>`);
    // Agent name: 13px mono, muted, left-aligned at x = node x + 24, baseline = node y + 28
    p(`<text x="${AG_X + 24}" y="${a.y + 28}" text-anchor="start" style="font-size:13px;fill:var(--color-muted, #4A6A80);font-family:'JetBrains Mono',monospace;">${a.name}</text>`);
    // Score: 32px mono bold, risk color, left-aligned at x = node x + 24, baseline = node y + 62
    p(`<text x="${AG_X + 24}" y="${a.y + 62}" text-anchor="start" style="font-size:32px;font-weight:bold;fill:${a.color};font-family:'JetBrains Mono',monospace;">${a.score.toFixed(1)}</text>`);
    // Level tag: 11px mono bold, risk color, right-aligned at x = node x + 236, baseline = node y + 28
    p(`<text x="${AG_X + 236}" y="${a.y + 28}" text-anchor="end" style="font-size:11px;font-weight:bold;fill:${a.color};font-family:'JetBrains Mono',monospace;">${getLevelTag(a.score)}</text>`);
  });

  /* ── 9. Node 5: Consensus (right column) ─────────────────────── */
  const cGlow = getVerdictGlow(label);
  p(`<rect x="${CN_X}" y="${CN_Y}" width="${CN_W}" height="${CN_H}" rx="8" fill="#0F1B2A" stroke="${vc}" stroke-width="2" style="filter:drop-shadow(0 0 18px ${cGlow});"/>`);
  // "Consensus N/3": 12px mono, muted, centered at x=820, baseline y=184
  p(`<text x="${CN_CX}" y="184" text-anchor="middle" style="font-size:12px;fill:var(--color-muted, #4A6A80);font-family:'JetBrains Mono',monospace;">Consensus ${consensus}/3</text>`);
  // Verdict word: 28px mono bold, verdict color, centered, baseline y=226
  p(`<text x="${CN_CX}" y="226" text-anchor="middle" style="font-size:28px;font-weight:bold;fill:${vc};font-family:'JetBrains Mono',monospace;">${label}</text>`);
  // "Score 78.4": 12px mono, muted, centered, baseline y=252
  p(`<text x="${CN_CX}" y="252" text-anchor="middle" style="font-size:12px;fill:var(--color-muted, #4A6A80);font-family:'JetBrains Mono',monospace;">Score ${combined.toFixed(1)}</text>`);

  p(`</svg>`);
  p(`</div>`);

  return lines.join('\n');
}

</script>
<script>
(function(){
  var result = {"t": {"id": "T3768"}, "behavior": 84.0, "velocity": 60.0, "risk": 64.0, "anomaly": 100.0, "combined": 82.0, "consensus": 1, "label": "FRAUD"};
  document.body.innerHTML = network(result);
})();
</script>
</body>
</html>
